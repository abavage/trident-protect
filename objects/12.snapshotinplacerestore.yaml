The "DEL" type indicates that this volume has already been logically deleted (likely by Trident Protect's background garbage collection catching up) but is currently sitting in ONTAP's Volume Recovery Queue.

The Recovery Queue acts as a recycle bin. Because the clone is technically in the trash, you cannot bring it online or split it. However, it still holds the lock on your parent snapshot until it is permanently purged.


