NetApp Custom Resources used for reverting to a previous state, they belong to different products and operate at entirely different scopes: TridentActionSnapshotRestore handles a single storage volume, whereas SnapshotInplaceRestore handles a complete application stack.

TridentActionSnapshotRestorei
Product: Core NetApp Trident CSI Driver (trident.netapp.io/v1).
Scope: Single Volume (PVC).   
Function: Reverts a single PersistentVolumeClaim directly to a standard Kubernetes VolumeSnapshot.
Workflow: Highly manual. As you experienced earlier, you must manually scale down any workloads attached to the PVC before applying the restore, and manually scale them back up once finished.

SnapshotInplaceRestore
Product: NetApp Trident Protect (protect.trident.netapp.io/v1).
Scope: Full Application (Data + Kubernetes Objects).
Function: Restores an entire logical application-which can include multiple PVCs, Deployments, ConfigMaps, and execution hooks-from a protection AppVault back into its original namespace.   
Workflow: Automated. Trident Protect automatically pauses active protection schedules, cancels in-progress backups, orchestrates the restore, and re-enables schedules once complete. 




---
apiVersion: protect.trident.netapp.io/v1
kind: SnapshotInplaceRestore
metadata:
  name: restore-single-pvc-1
  namespace: app-prod
spec:
  appVaultRef: lab-vault
  appArchivePath: one_8171833c-1701-4051-ae5f-206eb5f1c5b7/snapshots/20261103045500_custom-d4031-20261103045500_449f18c9-004f-4afc-9e55-a93eb73a3112
  resourceFilter:
    resourceSelectionCriteria: "Include"
    resourceMatchers:
      - kind: PersistentVolumeClaim
        version: v1
        names: 
          - iscsi
        namespaces: 
          - app-prod
