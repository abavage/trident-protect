  sourceApplicationName: one
  sourceApplicationUID: 27a608f1-cceb-4b37-bb1d-0f6a4dee84b0
  #storageClassName: storage-class-iscsi
  storageClassMapping:
    - source: storage-class-iscsi
      destination: storage-class-iscsi
